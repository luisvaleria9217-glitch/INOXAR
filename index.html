function saveCorrectRejectedOp(orderId, form) {
  const o = state.orders.find(x=>x.id===orderId); if (!o) return;
  const d = Object.fromEntries(new FormData(form).entries());
  if (d.clientName) o.clientName=d.clientName;
  if (d.productId) o.productId=d.productId;
  if (+d.qty) o.qty=+d.qty;
  if (+d.total) o.total=+d.total;
  if (+d.tiempo) o.tiempo=+d.tiempo;
  if (d.deliveryAddress) o.deliveryAddress=d.deliveryAddress;
  o.opRejected = false;
  (o.auditEdits=o.auditEdits||[]).push({ at:nowISO(), by:state.currentUser?.name||o.asesor||'Comercial', note:'corrección tras rechazo: '+(d.responseNote||'') });
  pushNotification({ type:'info', text:`${o.id} corregido por ${o.asesor||'comercial'} — pendiente re-verificación`, link:'auditoria', key:`recorr_${o.id}_${Date.now()}` });
  save(); closeModal('modal-correct-op'); renderAll(); toast(`${o.id} corregido y reenviado a auditoría`,'ok');
}

function saveAuditEditOrder(orderId, form) {
  const o = state.orders.find(x=>x.id===orderId); if (!o) return;
  const d = Object.fromEntries(new FormData(form).entries());
  const changes = [];
  if (d.clientName && d.clientName!==o.clientName) { changes.push(`cliente: "${o.clientName}"→"${d.clientName}"`); o.clientName=d.clientName; }
  if (d.productId && d.productId!==o.productId) { changes.push(`producto cambiado`); o.productId=d.productId; }
  if (+d.qty && +d.qty!==o.qty) { changes.push(`qty: ${o.qty}→${d.qty}`); o.qty=+d.qty; }
  if (+d.total && +d.total!==o.total) { changes.push(`total: ${o.total}→${d.total}`); o.total=+d.total; }
  if (+d.tiempo && +d.tiempo!==o.tiempo) { changes.push(`tiempo: ${o.tiempo}→${d.tiempo}`); o.tiempo=+d.tiempo; }
  if (d.deliveryAddress && d.deliveryAddress!==o.deliveryAddress) { o.deliveryAddress=d.deliveryAddress; changes.push('dirección actualizada'); }
  if (d.auditComment) o.auditComment = d.auditComment;
  (o.auditEdits=o.auditEdits||[]).push({ at:nowISO(), by:state.currentUser?.name||'Auditoría', note:changes.join('; ')||'edición sin cambios' });
  save(); closeModal('modal-audit-edit'); renderAll(); toast(`OP ${o.id} editada por auditoría`,'ok');
}

function saveAuditConsumos(orderId, form) {
  const o = state.orders.find(x=>x.id===orderId); if (!o) return;
  const fd = new FormData(form);
  const changes = [];
  state.supplyIssues = state.supplyIssues || [];
  // Crear ajuste: para cada supply con nueva cantidad distinta a la sumada previa, crear issue ajuste
  const qty = +o.qty||1;
  const prev = {};
  (state.supplyIssues||[]).filter(si=>(si.orderIds||[]).includes(o.id)).forEach(si=>{
    (si.items||[]).forEach(it => { prev[it.supplyId] = (prev[it.supplyId]||0) + (si.type==='devolucion'? -it.qty : it.qty); });
  });
  const ajusteItems = [];
  fd.forEach((val, key) => {
    if (!key.startsWith('real_')) return;
    const sid = key.slice(5);
    const newQty = +val || 0;
    const prevQty = prev[sid] || 0;
    const delta = newQty - prevQty;
    if (Math.abs(delta) > 0.0001) {
      ajusteItems.push({ supplyId:sid, qty:Math.abs(delta), sign:delta>0?1:-1 });
      // actualizar stock del insumo (delta positivo = más consumo = menos stock)
      const s = state.supplies.find(x=>x.id===sid);
      if (s) { s.stock = Math.max(0, (s.stock||0) - delta); }
      changes.push(`${s?.name||sid}: ${prevQty}→${newQty}`);
    }
  });
  if (!ajusteItems.length) { toast('Sin cambios en consumos','info'); return; }
  state.counters.sisu = (state.counters.sisu||5000)+1;
  state.supplyIssues.unshift({
    id:'SI-'+state.counters.sisu,
    orderIds:[o.id],
    type:'ajuste_auditoria',
    date:today(),
    by:state.currentUser?.name||'Auditoría',
    items: ajusteItems.map(a=>({ supplyId:a.supplyId, qty:a.qty*a.sign })),
    notes:`Ajuste por auditoría: ${changes.join(' · ')}`
  });
  (o.auditEdits=o.auditEdits||[]).push({ at:nowISO(), by:state.currentUser?.name||'Auditoría', note:'ajuste consumos: '+changes.join('; ') });
  save(); closeModal('modal-audit-detail'); renderAll(); toast('Consumos actualizados · inventario de insumos ajustado','ok');
  openAuditCloseDetail(orderId);
}

function recalcBomCostMaster() {
  const rows = document.querySelectorAll('#pm-bom .grid');
  let total = 0;
  rows.forEach(r => {
    const sel = r.querySelector('select'); const qty = +r.querySelector('input[name="bom_qty[]"]').value||0;
    const cost = +(sel.options[sel.selectedIndex]?.dataset.cost||0);
    const sub = Math.round(cost*qty);
    r.querySelector('.row-cost').textContent = sub>0 ? fmtCOP(sub) : '—';
    total += sub;
  });
  const c = document.getElementById('pm-cost'); if (c) c.textContent = fmtCOP(total);
  const ci = document.getElementById('pm-cost-input');
  if (ci && (!ci.dataset.manual || ci.dataset.manual==='0')) ci.value = total;
  recalcMarginMaster();
}

function recalcMarginMaster() {
  const c = +(document.getElementById('pm-cost-input')?.value||0);
  const p = +(document.getElementById('pm-price')?.value||0);
  const m = p>0 ? Math.round((p-c)/p*100) : 0;
  const el = document.getElementById('pm-margin'); if (!el) return;

function saveNewProductFromInnov(form) {
  const fd = new FormData(form);
  const orderId = fd.get('orderId');
  const order = state.orders.find(x=>x.id===orderId);
  if (!order) { toast('Pedido no encontrado','error'); return; }
  const name = fd.get('name')?.trim();
  if (!name) { toast('Nombre requerido','error'); return; }
  const areas = fd.getAll('areas[]');
  const supIds = fd.getAll('bom_sup[]'); const qtys = fd.getAll('bom_qty[]');
  const bom = supIds.map((s,i)=>({ supplyId:s, qty:+qtys[i]||0 })).filter(b=>b.supplyId && b.qty>0);

  state.counters.prod++;
  const sku = fd.get('sku')?.trim() || `PRD-${String(state.counters.prod).padStart(3,'0')}`;
  const id = 'p'+(state.products.length+1);

  const price = +fd.get('price')||0;
  const cat = fd.get('category')||'Otros';
  const catOther = fd.get('categoryOther')||'';
  const finalCategory = (cat === 'Otros' && catOther.trim()) ? catOther.trim() : cat;
  const product = {
    id, sku, name,
    description: fd.get('description')||'',
    category: finalCategory,
    photo: fd.get('photo')||'📦',
    warehouseId: fd.get('warehouseId'),
    cost: +fd.get('cost')||0,
    price,
    stock: 0,
    min: +fd.get('min')||0,
    entryDate: today(),
    dimensions: { ancho:+fd.get('ancho')||0, alto:+fd.get('alto')||0, profundidad:+fd.get('profundidad')||0 },
    areas, bom,
    verified: false
  };
  state.products.push(product);

  const qty = order.productoPropuesto?.qty || 1;
  order.items = [{ type:'producto', productId:id, name, qty, price, discount:0, subtotal: qty*price, acabados:{} }];
  order.total = qty*price;
  order.tipo = 'produccion';
  order.estado = 'pendiente_op';
  order.productId = id;

  const innov = (state.innovation||[]).find(x=>x.id===order.innovationId);
  if (innov) { innov.estado = 'aprobado'; innov.productId = id; innov.approvedAt = today(); }

  pushNotification({ type:'info', text:`Producto ${name} creado desde innovación — OP ${orderId} liberada`, targetUser:order.asesor, link:'ventas' });

  save(); closeModal('modal-np'); renderAll();
  toast(`Producto ${name} creado — OP ${orderId} en flujo normal`,'ok');
}

function saveEmployee(form, id) {
  const d = Object.fromEntries(new FormData(form).entries());
  if (id) {
    const e = state.employees.find(x=>x.id===id);
    if (e) Object.assign(e, d, { salario:+d.salario||0, bono:+d.bono||0 });
    save(); closeModal('modal-emp'); renderAll(); toast('Empleado actualizado','ok'); return;
  }
  state.counters.emp++;
  state.employees.push({
    id:'E-'+String(state.counters.emp).padStart(3,'0'),
    name:d.name, cc:d.cc, role:d.role, area:d.area, sexo:d.sexo,
    celular:d.celular, direccion:d.direccion, ciudad:d.ciudad,
    fechaNacimiento:d.fechaNacimiento, hiredAt:d.hiredAt, fechaRetiro:d.fechaRetiro,
    tipoContrato:d.tipoContrato, arl:d.arl, fondoPension:d.fondoPension,
    salud:d.salud, cajaCompensacion:d.cajaCompensacion, estado:d.estado||'activo',
    salario:+d.salario||0, bono:+d.bono||0, lugarTrabajo:d.lugarTrabajo,
    email:d.email
  });
  save(); closeModal('modal-emp'); renderAll(); toast('Empleado agregado','ok');
}

const grid = k => `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${k.join('')}</div>`;

function renderHomeGerencia() {
  const hoy = today();
  const sum = (arr,f) => arr.reduce((a,x)=>a+(+f(x)||0),0);
  const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
  const dec = n => (Math.round(n*10)/10).toFixed(1).replace('.',',');
  const sec = (titulo,color) => `<div class="flex items-center gap-3 mt-7 mb-3"><span class="w-1 h-4 rounded" style="background:${color}"></span><h3 class="text-xs font-bold uppercase tracking-[0.18em] text-white">${titulo}</h3><span class="flex-1 h-px" style="background:#363F52"></span></div>`;

  const saldoPedido = o => (+o.total||0) * (1 - Math.min(100,Math.max(0,+o.paid||0))/100);

  const leadsConvertidos = state.leads.filter(l=>l.estado==='ganado' || l.linkedCustomerId).length;
  const convLeads = pct(leadsConvertidos, state.leads.length);
  const cotAbiertas = state.quotes.filter(q=>['borrador','enviada'].includes(q.estado));
  const cotValor = sum(cotAbiertas, q=>quoteTotal(q));
  const cotAceptadas = state.quotes.filter(q=>q.estado==='aceptada').length;
  const tasaAcept = pct(cotAceptadas, state.quotes.length);
  const ventasTot = sum(state.orders, o=>o.total);
  const ticket = state.orders.length ? ventasTot/state.orders.length : 0;
  const costoVentas = sum(state.orders, o=>{ const p = state.products.find(x=>x.id===o.productId); return p ? (+p.cost||0)*(+o.qty||1) : 0; });
  const margen = ventasTot ? ((ventasTot-costoVentas)/ventasTot*100) : 0;
  const clientesActivos = state.customers.filter(c=>customerProcesosActivos(c.id)>0).length;

  /* Producción */
  const enProd = state.orders.filter(o=>o.estado==='produccion');
  const proximas7 = enProd.filter(o=>o.dueDate && daysBetween(hoy,o.dueDate)>=0 && daysBetween(hoy,o.dueDate)<=7).length;
  const retrasadas = state.orders.filter(o=>!['entregado','facturado','op_cerrada'].includes(o.estado) && o.dueDate && o.dueDate < hoy).length;
  const entregadas = state.orders.filter(o=>['entregado','facturado','op_cerrada'].includes(o.estado));
  const aTiempo = entregadas.filter(o=>!o.dueDate || o.dueDate >= hoy).length;
  const cumplimiento = entregadas.length ? pct(aTiempo, entregadas.length) : 100;
  const ciclo = enProd.length ? Math.round(sum(enProd, o=>o.tiempo || (o.orderDate&&o.dueDate ? Math.max(0,daysBetween(o.orderDate,o.dueDate)) : 0)) / enProd.length) : 0;
  const salidasLamina = [];
  (state.supplyIssues||[]).forEach(si=>{
    (si.items||[]).forEach(it=>{
      const s = state.supplies.find(x=>x.id===it.supplyId);
      if (s && s.category==='Lámina inox') salidasLamina.push({ qty:+it.qty||0, tipo:si.type||'salida' });
    });
  });
  const usaLamina = sum(salidasLamina, x=>x.qty);
  const mermaLamina = usaLamina>0 ? Math.min(100, Math.round(sum(salidasLamina.filter(x=>x.tipo==='ajuste'||x.tipo==='merma'),x=>x.qty)/usaLamina*1000)/10) : 0;

  /* Finanzas */
  const caja = sum(state.bankAccounts, b=>b.balance);
  const ingresosConf = sum(state.payments.filter(p=>p.estado==='confirmado'), p=>p.amount);
  const anticipos = sum(state.payments.filter(p=>p.estado==='confirmado' && p.type==='anticipo'), p=>p.amount);

  const burn = nomina + egresosConf;

  const cobertura = nomina>0 ? caja/nomina : 0;

  /* Cartera */

  const carteraAlDia = sum(pendientesCobro.filter(o=>!o.dueDate || o.dueDate>=hoy), saldoPedido);
  const carteraVenc1 = sum(pendientesCobro.filter(o=>o.dueDate && o.dueDate<hoy && daysBetween(o.dueDate,hoy)<=30), saldoPedido);
  const carteraVenc30 = sum(pendientesCobro.filter(o=>o.dueDate && o.dueDate<hoy && daysBetween(o.dueDate,hoy)>30), saldoPedido);

  const valorInsumos = sum(state.supplies, s=>(+s.stock||0)*(+s.cost||0));
  const bajoMinimo = state.supplies.filter(s=>(+s.stock||0)<=(+s.min||0)).length;

    ${sec('Finanzas','#10b981')}

      kpiCard('Caja total', fmtCOP(caja), `${state.bankAccounts.length} cuentas`, 'bank', '#08A9E6'),

      kpiCard('Meses de caja', `${dec(mesesCaja)} meses`, 'Caja / egresos + nómina', 'book', '#8b5cf6'),

const COST_RE = /costo|margen|rentab/i, MONEY_RE = /precio|valor|total|monto|saldo|subtotal|cop\b/i;
function scrubForRole(root) {
  const r = curRole(); if (r === 'gerencia') return;
  const bad = t => COST_RE.test(t) || (r === 'produccion' && MONEY_RE.test(t));
  root.querySelectorAll('table').forEach(t => {
    [...t.querySelectorAll('thead th')].forEach((th,i) => {
      if (th.style.display === 'none' || !bad(th.textContent)) return;
      t.querySelectorAll('tr').forEach(tr => { const c = tr.children[i]; if (c) c.style.display = 'none'; });
    });
  });
  root.querySelectorAll('label, .label').forEach(l => {
    if (bad(l.textContent) && l.parentElement && l.parentElement.querySelector('input,select,textarea')) l.parentElement.style.display = 'none';
  });
  root.querySelectorAll('[data-cost-cell]').forEach(e => e.style.display = 'none');
  root.querySelectorAll('#content-area *').forEach(e => {
    if (e.children.length || e.offsetParent === null) return;
    const t = e.textContent.trim(); if (!t || t.length > 60) return;
    if (COST_RE.test(t) || (r === 'produccion' && /^\$/.test(t))) {
      const box = e.closest('.kpi-card, tr, li') || e; box.style.display = 'none';
    }
  });
  root.querySelectorAll('div,span,p').forEach(e => {
    if (e.children.length === 0 && /^\s*(margen|costo)/i.test(e.textContent) && e.parentElement && e.parentElement.children.length <= 3) e.parentElement.style.display = 'none';
  });
}

const _isoPay = p => p.method === 'Saldo a favor';

/* Recalcula lo pagado de un pedido y el saldo a favor (si pagó de más) */
function syncPedidoPaid(ped) {
  const all = (state.payments || []).filter(x => x.estado === 'confirmado');
  const mine = all.filter(x => x.pedidoId === ped.id);
  const real = mine.filter(x => !_isoPay(x)).reduce((a,x) => a + (+x.amount||0), 0);
  const applied = mine.filter(_isoPay).reduce((a,x) => a + (+x.amount||0), 0);
  const outs = all.filter(x => _isoPay(x) && x.fromPedidoId === ped.id).reduce((a,x) => a + (+x.amount||0), 0);
  const total = +ped.total || 0;
  ped.paidAmount = real + applied;
  if (total > 0) {
    ped.saldoFavor = Math.max(0, real - total - outs);
    ped.paid = Math.min(100, Math.round(ped.paidAmount / total * 100));
  }
  state.orders.filter(o => o.pedidoId === ped.id).forEach(o => {
    o.paid = ped.paid;
    if (o.paid >= 60 && o.estado === 'pendiente_pago') o.estado = 'produccion';
  });
}
function syncSaldosCliente() {
  (state.customers || []).forEach(c => {
    c.saldoFavor = (state.pedidos || []).filter(p => p.customerId === c.id).reduce((a,p) => a + (p.saldoFavor||0), 0);
  });
}

/* Aprobar pago: si pagó de más, queda saldo a favor del cliente */
const _approvePayment0 = approvePayment;
approvePayment = function(id) {
  const p = state.payments.find(x => x.id === id); if (!p) return;
  if (_isoPay(p)) {
    if (p.estado === 'confirmado') return;
    p.estado = 'confirmado'; p.approvedAt = today(); p.approvedBy = state.currentUser?.name || 'Tesorería';
    const ped = (state.pedidos || []).find(x => x.id === p.pedidoId); if (ped) syncPedidoPaid(ped);
    syncSaldosCliente(); save(); renderPage(); toast('Saldo a favor aplicado al pedido', 'ok'); return;
  }
  _approvePayment0(id);
  const q = state.payments.find(x => x.id === id);
  const ped = q && (state.pedidos || []).find(x => x.id === q.pedidoId);
  if (ped && q.estado === 'confirmado') {
    const before = ped.saldoFavor || 0; syncPedidoPaid(ped); syncSaldosCliente();
    if ((ped.saldoFavor || 0) > before) {
      pushNotification({ type:'info', text:`💰 ${ped.clientName} pagó de más en ${ped.id}: saldo a favor ${fmtCOP(ped.saldoFavor)}`, link:'tesoreria', key:'sf-'+ped.id+'-'+ped.saldoFavor });
      toast('Pago mayor al total: saldo a favor ' + fmtCOP(ped.saldoFavor), 'ok');
    }
    save(); renderPage();
  }
};

  if (p.estado === 'pendiente_aprobacion_gerencia') {

      ${_isGerencia() ? `<div class="flex gap-2"><button onclick="approvePedido('${p.id}')" class="btn-gold text-xs flex-1">✓ Aprobar pedido</button><button onclick="rejectPedido('${p.id}')" class="btn-outline text-xs flex-1">✕ Rechazar</button></div>` : `<div class="text-[11px] text-brand-muted">Solo el perfil Gerencia puede aprobar o rechazar.</div>`}</div>`;
  }
  if (p.estado === 'rechazado') return `<div class="panel-2 p-3 mb-4 rounded" style="border-left:3px solid #ef4444"><div class="text-xs text-red-300">✕ Pedido rechazado por gerencia${p.rejectedReason?': '+escape(p.rejectedReason):''}.</div></div>`;
  if (p.approvedAt) return `<div class="panel-2 p-3 mb-4 rounded" style="border-left:3px solid #10b981"><div class="text-xs text-emerald-300">✓ Aprobado por ${escape(p.approvedBy||'Gerencia')} el ${fmtDate(p.approvedAt)}</div></div>`;
  return '';
}
function approvePedido(id) {
  if (!_isGerencia()) { toast('Solo gerencia puede aprobar','error'); return; }
  const p = state.pedidos.find(x=>x.id===id); if (!p || p.estado!=='pendiente_aprobacion_gerencia') return;
  state.orders.filter(o=>o.pedidoId===id && o.estado==='pendiente_aprobacion_gerencia').forEach(o => {
    o.estado = o.tipo==='innovacion' ? 'pendiente_innovacion' : (o.estadoPrevio || 'pendiente_op'); delete o.estadoPrevio; });
  (state.innovation||[]).filter(i=>i.pedidoId===id && i.estado==='pendiente_aprobacion_gerencia').forEach(i=>{ i.estado='aprobada'; });
  p.estado = 'aprobada'; p.approvedAt = today(); p.approvedBy = state.currentUser?.name || 'Gerencia';
  pushNotification({ type:'success', text:`Pedido ${id} aprobado: sus OP pasan a producción`, link:'produccion', key:'pedOk-'+id });
  save(); renderAll(); openPedidoDetail(id); toast(`Pedido ${id} aprobado`,'ok');
}
function rejectPedido(id) {
  if (!_isGerencia()) { toast('Solo gerencia puede rechazar','error'); return; }
  const p = state.pedidos.find(x=>x.id===id); if (!p || p.estado!=='pendiente_aprobacion_gerencia') return;
  const motivo = prompt('Motivo del rechazo (obligatorio):'); if (!motivo || !motivo.trim()) { toast('Escribe el motivo del rechazo','error'); return; }
  state.orders.filter(o=>o.pedidoId===id).forEach(o => {
    if (o.tipo==='stock') { state.finishedStock.filter(f=>f.orderId===o.id && f.status==='reservado').forEach(f=>{ f.status='disponible'; delete f.orderId; delete f.pedidoId; });
      const pm = state.products.find(x=>x.id===o.productId); if (pm) pm.stock = (pm.stock||0) + (o.qty||0); }
    o.estado = 'cancelado'; delete o.estadoPrevio; });
  (state.innovation||[]).filter(i=>i.pedidoId===id).forEach(i=>{ i.estado='rechazada'; });
  p.estado = 'rechazado'; p.rejectedReason = motivo.trim(); p.rejectedAt = today();
  save(); renderAll(); openPedidoDetail(id); toast(`Pedido ${id} rechazado`,'ok');
}
function quoteAprobBanner(q) {
  if (q.estado !== 'pendiente_aprob') return '';
  return `<div class="panel-2 p-3 mb-4 rounded" style="border-left:3px solid #f59e0b"><div class="text-xs text-amber-300 mb-2">⏳ Cotización con descuento o vigencia especial: requiere aprobación de gerencia antes de enviarse.</div>
    ${_isGerencia() ? `<div class="flex gap-2"><button onclick="approveQuote('${q.id}',true)" class="btn-gold text-xs flex-1">✓ Aprobar</button><button onclick="approveQuote('${q.id}',false)" class="btn-outline text-xs flex-1">✕ Rechazar</button></div>` : `<div class="text-[11px] text-brand-muted">Solo el perfil Gerencia puede aprobar o rechazar.</div>`}</div>`;
}
function approveQuote(id, ok) {

  const q = state.quotes.find(x=>x.id===id); if (!q) return;

/* Cotización aceptada → pedido + OP automáticos (DESACTIVADO: la venta la crea el comercial manualmente) */
function autoSaleFromQuote(q) {
  const S = state;
  let c = S.customers.find(x => x.id === q.customerId) || S.customers.find(x => x.name === q.clientName);
  if (!c) { const ids = S.customers.map(x => +String(x.id).replace(/\D/g,'') || 0);
    c = { id:'C-'+String(Math.max(0,...ids)+1).padStart(3,'0'), name:q.clientName, type:'empresa', city:q.city||'', createdAt:today(), fromLead:q.leadId||null, linkedLeadId:q.leadId||null, postSales:[], notes:[], seguimientos:[] }; S.customers.push(c); }
  const items = (q.items || []).filter(i => i.qty > 0 && i.price > 0); if (!items.length) return;
  S.counters.pedV7 = (S.counters.pedV7 || 1260) + 1; const pid = 'P-' + S.counters.pedV7;
  const tiempo = q.tiempo || 30, docType = c.docType || 'factura', asesor = q.asesor || '';
  const ped = { id:pid, customerId:c.id, clientName:q.clientName, quoteId:q.id, asesor, tiempo, docType, address:c.address||'', deliveryAddress:c.deliveryAddress||c.address||'',
    orderDate:today(), dueDate:addDays(today(), tiempo), total:0, paid:0, estado:'activo', tipo:'produccion', notes:[], seguimientos:[], autoCreated:true };
  items.forEach(it => { S.counters.op++; const line = Math.round(it.qty * it.price * (1 - (it.discount||0)/100)); ped.total += line;
    S.orders.unshift({ id:'OP-'+S.counters.op, pedidoId:pid, quoteId:q.id, customerId:c.id, clientName:q.clientName, total:line, paid:0, tiempo,
      orderDate:today(), dueDate:addDays(today(), tiempo), estado:'pendiente_op', area:null, asesor, tipo:'produccion', verified:false,
      productId:it.productId, qty:it.qty, price:it.price, discount:it.discount||0, docType, acabados:{}, comment:it.desc||'', address:ped.address, deliveryAddress:ped.deliveryAddress }); });
  (S.pedidos = S.pedidos || []).unshift(ped); q.autoSale = true; q.pedidoId = pid;
  const lead = S.leads.find(l => l.id === q.leadId); if (lead && lead.estado !== 'ganado') { lead.estado = 'ganado'; lead.linkedCustomerId = c.id; }
  pushNotification({ type:'success', text:`✅ Cotización ${q.id} aceptada: se creó el pedido ${pid} y sus OP (pendientes de aprobación)`, link:'ventas', key:'auto-'+q.id });
}

/* Conciliación: se ejecuta en cada guardado y deja los módulos coherentes entre sí */
function ensureCollections() { ['supplyReceipts','supplyIssues','followups','dispatchRequests','invoiceRequests','stockMoves','postSales','warranties','invoices','payments','pedidos','accountEntries'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; }); }
ensureCollections();
function reconcile() {
  const S = state; if (!S || !S.orders) return;
  ensureCollections();
  (S.pedidos || []).forEach(p => { if ((S.payments || []).some(x => x.estado === 'confirmado' && x.pedidoId === p.id)) syncPedidoPaid(p); });
  syncSaldosCliente();
  /* aprobación gerencia → pedido aprobado / en producción */
  (S.pedidos || []).forEach(p => { if (p.estado !== 'pendiente_aprobacion_gerencia') return;
    const os = S.orders.filter(o => o.pedidoId === p.id);
    if (os.length && os.every(o => o.estado !== 'pendiente_aprobacion_gerencia')) { p.estado = os.some(o => o.estado === 'produccion') ? 'en_produccion' : 'aprobada'; p.approvedAt = today(); p.approvedBy = S.currentUser?.name || 'Gerencia'; } });
  /* cotización aceptada → venta */
  /* Regla INOXAR: una cotización aceptada NO crea nada sola; el comercial crea la venta manualmente (autoSaleFromQuote desactivada) */
  /* despachado → postventa (NPS 7d/6m/12m) y garantía */
  const del = S.orders.filter(o => o.estado === 'despachado' || o.estado === 'entregado');
  del.forEach(o => { if (!o.deliveredAt) o.deliveredAt = today(); if (!o.warrantyUntil) o.warrantyUntil = addDays(o.deliveredAt, 365); });
  if (del.length) ensureFollowupSchedule();
  /* garantía enlazada a cliente, pedido, factura y producto originales */
  (S.warranties || []).forEach(w => { const o = S.orders.find(x => x.id === w.orderId) || (w.pedidoId && S.orders.find(x => x.pedidoId === w.pedidoId)); if (!o) return;
    if (!w.customerId) w.customerId = o.customerId; if (!w.clientName) w.clientName = o.clientName; if (!w.pedidoId) w.pedidoId = o.pedidoId; if (!w.productId) w.productId = o.productId;
    if (!w.invoiceId) { const inv = (S.invoices || []).find(i => i.orderId === o.id || (o.pedidoId && i.orderId === o.pedidoId)); if (inv) w.invoiceId = inv.id; } });
  accountingSync();
}
/* Asientos para movimientos que antes no dejaban rastro contable */
function accountingSync() {
  const S = state, first = !S.integrationV1; S.integrationV1 = true;
  const ae = (date, concept, debit, credit, type) => { if (!first) S.accountEntries.unshift({ id:uid('AE'), date:date||today(), concept, debit, credit, type }); };
  const val = items => (items || []).reduce((a,i) => { const s = S.supplies.find(x => x.id === i.supplyId); return a + (+i.qty||0) * (+i.cost || s?.cost || 0); }, 0);
  (S.supplyReceipts || []).filter(r => !r.aeDone).forEach(r => { r.aeDone = true; const sup = S.suppliers.find(x => x.id === r.supplierId);
    ae(r.date, `Entrada de insumos ${r.id} · ${sup?.name||''} (OC ${r.purchaseOrderId||'—'}) · cuenta por pagar`, val(r.items), 0, 'cxp'); });
  (S.supplyIssues || []).filter(r => !r.aeDone).forEach(r => { r.aeDone = true;
    ae(r.date, `${r.type==='devolucion'?'Devolución':'Salida'} de insumos ${r.id} → ${(r.orderIds||[]).join(', ')||'planta'} (costo de OP)`, r.type==='devolucion'?val(r.items):0, r.type==='devolucion'?0:val(r.items), 'inventario'); });
  (S.finishedStock || []).filter(f => !f.aeDone).forEach(f => { f.aeDone = true; if (f.source !== 'produccion') return; const p = S.products.find(x => x.id === f.productId);
    ae(f.readyDate, `Ingreso a producto terminado ${f.id} · ${p?.name||f.productId} × ${f.qty} (OP ${f.orderId||'—'})`, (p?.cost||0)*(f.qty||1), 0, 'inventario'); });
  (S.invoices || []).filter(i => !i.aeDone).forEach(i => { i.aeDone = true; ae(i.emitDate||i.date, `${i.type==='remisión'?'Remisión':'Factura'} ${i.id} · ${i.clientName||''} · cuenta por cobrar`, +i.amount||0, 0, 'cxc'); });
}
const _save0 = save; let _reconRunning = false;
save = function() { if (!_reconRunning) { _reconRunning = true; try { reconcile(); } catch (e) { console.error('reconcile', e); } finally { _reconRunning = false; } } return _save0.apply(this, arguments); };
/* Despacho: en cuanto se despacha, queda abierto el seguimiento de postventa */
['markOrderDespachado','despacharSolicitud'].forEach(n => { const f0 = window[n]; if (typeof f0 === 'function') window[n] = function() { const r = f0.apply(this, arguments); try { reconcile(); save(); } catch(e){} return r; }; });

/* ===== LÁPICES: cada registro editable se marca con ✏️ ===== */
(function(){ const st=document.createElement('style');
  st.textContent='.pencil-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:8px;border-radius:8px;border:1px solid #363F52;background:#1E2430;color:#8FD8F5;font-size:13px;cursor:pointer;vertical-align:middle;line-height:1}.pencil-btn:hover{background:#08A9E6;color:#12161F;border-color:#08A9E6}.pencil-card{position:absolute;top:8px;right:8px;z-index:5;margin:0}.pencil-hint{font-size:11px;color:#9AA3AE;margin:0 0 10px;text-align:right}';
  document.head.appendChild(st); })();
const PEN_RULES = {
  leads:[[/^L-\d+$/,id=>openLeadForm(id)]],
  clientes:[[/^C-\d+$/,id=>openCustomerForm(id)]],
  cotizaciones:[[/^COT-\d+$/,id=>openQuoteDetail(id)]],
  ventas:[[/^P-\d+$/,id=>openPedidoDetail(id)]],
  almacen:[[/^IN-\d+$/,id=>openSupplyForm(id)],[/^SUP-\d+$/,id=>openSupplierForm(id)],[/^OC-\d+$/,id=>openPurchaseOrderDetail(id)]],
  produccion:[[/^OP-\d+$/,id=>openGenericEdit('orders',id)]],
  inventario:[[/^FS-\d+$/,id=>openGenericEdit('finishedStock',id)]],
  garantias:[[/^GAR-\d+$/,id=>openWarrantyDetail(id)]],
  tesoreria:[[/^PAG-\d+$/,id=>openPaymentDetail(id)],[/^POUT-\d+$/,id=>openOutgoingPaymentDetail(id)]],
  rrhh:[[/^E-\d+$/,id=>openEmployeeForm(id)]],
  marketing:[[/^MKT-\d+$/,id=>openGenericEdit('marketingAssets',id)]],
  innovacion:[[/^p\d+$/,id=>openProductMasterEdit(id)]],
  auditoria:[[/^OP-\d+$/,id=>openAuditOrderDetail(id)]],
  contabilidad:[[/^AE-\d+$/,id=>openGenericEdit('accountEntries',id)]]
};
function penFind(page,id){ const rs=PEN_RULES[page]||[]; for(const [re,fn] of rs) if(re.test(id)) return fn; return null; }
function penGo(page,id){ const fn=penFind(page,id); if(fn) fn(id); }
function penId(el,page){ const rs=PEN_RULES[page]||[]; const html=el.outerHTML;
  for(const [re] of rs){ const src=re.source.replace(/^\^|\$$/g,''); const m=html.match(new RegExp("'("+src+")'")); if(m) return m[1]; }
  const t=((el.children[0]||{}).textContent||'').replace(/\s+/g,''); if(penFind(page,t)) return t;
  if(page==='contabilidad'){ const c=((el.children[1]||{}).textContent||'').trim(); const a=(state.accountEntries||[]).find(x=>x.concept===c); if(a) return a.id; }
  return t; }
function addPencils(){
  const page=state.currentPage, c=document.getElementById('content-area'); if(!c||!PEN_RULES[page]) return;
  let n=0;
  c.querySelectorAll('tr.table-row').forEach(tr=>{ if(tr.dataset.pen) return; const id=penId(tr,page); if(!penFind(page,id)) return;
    const old=[...tr.querySelectorAll('button')].find(x=>/[✎✏]/.test(x.textContent));
    if(old){ old.classList.add('pencil-btn'); old.textContent='✏️'; old.title='Editar'; tr.dataset.pen=1; n++; return; }
    let cell=null; for(let i=tr.children.length-1;i>=0;i--){ if(tr.children[i].style.display!=='none'){ cell=tr.children[i]; break; } } if(!cell) return;
    const b=document.createElement('button'); b.type='button'; b.className='pencil-btn'; b.title='Editar'; b.textContent='✏️';
    b.onclick=e=>{ e.stopPropagation(); penGo(page,id); }; cell.appendChild(b); tr.dataset.pen=1; n++; });
  c.querySelectorAll('[onclick]').forEach(el=>{ if(el.dataset.pen||el.tagName==='TR'||el.tagName==='BUTTON'||el.closest('tr')) return;
    const m=(el.getAttribute('onclick')||'').match(/'([A-Za-z]+-?\d+)'/); if(!m||!penFind(page,m[1])) return;
    const r=el.getBoundingClientRect(); if(r.width<120||r.height<60) return;
    if(getComputedStyle(el).position==='static') el.style.position='relative';
    const id=m[1], b=document.createElement('button'); b.type='button'; b.className='pencil-btn pencil-card'; b.title='Editar'; b.textContent='✏️';
    b.onclick=e=>{ e.stopPropagation(); penGo(page,id); }; el.appendChild(b); el.dataset.pen=1; n++; });
  if((n||c.querySelector('.pencil-btn'))&&!c.querySelector('.pencil-hint')){ const h=document.createElement('div'); h.className='pencil-hint'; h.textContent='✏️ El lápiz abre la edición del registro'; c.insertBefore(h,c.firstChild); }
}
let _penT=null;
new MutationObserver(()=>{ if(_penT) return; _penT=setTimeout(()=>{ _penT=null; try{ addPencils(); }catch(e){ console.error('pencils',e); } },60); })
  .observe(document.body,{childList:true,subtree:true});
